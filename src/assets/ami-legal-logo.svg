<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Ami Legal">
  <rect x="4" y="4" width="232" height="232" rx="52" fill="#7A1F2B" />

  <!-- Left leg of the A, with a flared serif foot -->
  <path d="M 108 50 L 40 192 L 50 192 L 60 174 L 84 174 L 90 192 L 100 192 Z" fill="#FBF7F0" />

  <!-- Right leg of the A: a short stroke that hands off into the ribbon swash -->
  <path d="M 108 50 L 138 138 L 118 126 Z" fill="#FBF7F0" />

  <!-- L: vertical stroke with top serif -->
  <path d="M 144 58 L 176 58 L 176 70 L 159 70 L 159 178 L 144 178 Z" fill="#FBF7F0" />

  <!-- L: base foot -->
  <path d="M 144 178 L 206 178 L 206 190 L 144 190 Z" fill="#FBF7F0" />

  <!-- Decorative swash ribbon, weaving the A into the L -->
  <path
    d="M 128 140 C 152 158, 172 164, 200 156"
    fill="none"
    stroke="#FBF7F0"
    stroke-width="15"
    stroke-linecap="round"
  />

  <!-- Small interwoven negative-space circle where the ribbon crosses the L -->
  <circle cx="159" cy="161" r="9" fill="#7A1F2B" />
</svg>
